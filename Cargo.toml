[package]
name = "model"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
description = "The Sootmark record and event model, and the contract parser adapters implement."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/model"
publish = false

[dependencies]
common = { git = "https://github.com/Sootmark/common", tag = "v0.3.0", version = "0.3.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
